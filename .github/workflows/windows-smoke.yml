# TEMPORARY: native Windows validation for MPI-2177. Not merged.
name: windows-smoke
on: push
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Guide step 1 - install Claude Code and add .local\bin to the user PATH
        run: |
          irm https://claude.ai/install.ps1 | iex
          $currentPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          [Environment]::SetEnvironmentVariable('PATH', "$currentPath;$env:USERPROFILE\.local\bin", 'User')
          [Environment]::GetEnvironmentVariable('PATH', 'User') -split ';' | Select-String '\.local\\bin'
      - name: Guide step 1 - Git Bash has curl, openssl, node
        run: '& "C:\Program Files\Git\bin\bash.exe" -c "curl --version | head -1; openssl version; node -v"'
      - name: Guide - run a script from PowerShell through Git Bash
        run: '& "C:\Program Files\Git\bin\bash.exe" ./scripts/check-dns.sh example.com | Select-Object -First 4'
      - name: Claude Code on Windows starts chrome-devtools-mcp via bare npx (same command as .mcp.json)
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          claude --version
          claude mcp add --scope local chrome-devtools-smoke -- npx -y chrome-devtools-mcp@1.12.0 --isolated
          claude mcp list
